name: Plugin Release

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Build target selection
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - linux

permissions:
  contents: write
  id-token: write

jobs:
  plugin-build:
    name: Plugin Build (${{ matrix.os }})
    if: ${{ inputs.platforms == 'all' || (inputs.platforms == 'macos' && matrix.os == 'macos-latest') || (inputs.platforms == 'windows' && matrix.os == 'windows-latest') || (inputs.platforms == 'linux' && matrix.os == 'ubuntu-latest') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            generator: Ninja
            build_type: Release
            multi_config: false
            plugin_targets: band-spectrum-analyzer_Standalone band-spectrum-analyzer_VST3 band-spectrum-analyzer_AU
          - os: ubuntu-latest
            generator: Ninja
            build_type: Release
            multi_config: false
            plugin_targets: band-spectrum-analyzer_Standalone band-spectrum-analyzer_VST3
          - os: windows-latest
            generator: Visual Studio 17 2022
            build_type: Release
            multi_config: true
            plugin_targets: band-spectrum-analyzer_Standalone band-spectrum-analyzer_VST3

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: lukka/get-cmake@latest

      - name: Restore UIKit assets
        shell: bash
        run: |
          set -euo pipefail

          gcs_path="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("ci/uikit.lock.json").read_text())
          print(data.get("gcs_path", ""))
          PY
          )"

          expected_sha="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("ci/uikit.lock.json").read_text())
          print(data.get("sha256", ""))
          PY
          )"

          if [[ -z "$gcs_path" || -z "$expected_sha" ]]; then
            echo "ci/uikit.lock.json is empty. Upload UIKit with scripts/uikit/push.sh first."
            exit 1
          fi

          archive_name="$(basename "$gcs_path")"
          gcloud storage cp "$gcs_path" "$archive_name"

          python - "$archive_name" "$expected_sha" <<'PY'
          import hashlib
          import pathlib
          import sys

          archive_path = pathlib.Path(sys.argv[1])
          expected_sha = sys.argv[2]
          actual_sha = hashlib.sha256(archive_path.read_bytes()).hexdigest()

          if actual_sha != expected_sha:
              raise SystemExit(
                  f"SHA-256 mismatch for {archive_path.name}: expected {expected_sha}, got {actual_sha}"
              )
          PY

          rm -rf src/ui/assets/uikit
          mkdir -p src/ui/assets
          tar -xzf "$archive_name" -C src/ui/assets

          if [[ ! -d src/ui/assets/uikit ]]; then
            echo "UIKit archive did not restore src/ui/assets/uikit"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libjack-jackd2-dev \
            libgtk-3-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            pkg-config

          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Configure
        if: matrix.multi_config == false
        run: >
          cmake -S . -B build-plugin
          -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure
        if: matrix.multi_config == true
        shell: pwsh
        run: >
          cmake -S . -B build-plugin
          -G "${{ matrix.generator }}"
          -A x64

      - name: Build plugin targets
        if: runner.os != 'Windows'
        run: |
          for target in ${{ matrix.plugin_targets }}; do
            cmake --build build-plugin --config ${{ matrix.build_type }} --target "$target"
          done

      - name: Build plugin targets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($target in "${{ matrix.plugin_targets }}".Split(" ")) {
            cmake --build build-plugin --config ${{ matrix.build_type }} --target $target
          }

      - name: Stage plugin artifacts
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail

          artifact_dir="build-plugin/ci-artifacts/${{ runner.os }}-${{ matrix.build_type }}"
          source_dir="build-plugin/src/band-spectrum-analyzer_artefacts/${{ matrix.build_type }}"

          mkdir -p "$artifact_dir"

          if [ -d "$source_dir/VST3" ]; then
            cp -R "$source_dir/VST3" "$artifact_dir/"
          fi

          if [ -d "$source_dir/Standalone" ]; then
            cp -R "$source_dir/Standalone" "$artifact_dir/"
          fi

          if [ -d "$source_dir/AU" ]; then
            cp -R "$source_dir/AU" "$artifact_dir/"
          fi

      - name: Stage plugin artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactDir = "build-plugin/ci-artifacts/${{ runner.os }}-${{ matrix.build_type }}"
          $sourceDir = "build-plugin/src/band-spectrum-analyzer_artefacts/${{ matrix.build_type }}"

          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          foreach ($folder in @("VST3", "Standalone", "AU")) {
            $candidate = Join-Path $sourceDir $folder
            if (Test-Path $candidate) {
              Copy-Item -Path $candidate -Destination $artifactDir -Recurse -Force
            }
          }

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ runner.os }}-${{ matrix.build_type }}
          path: build-plugin/ci-artifacts/${{ runner.os }}-${{ matrix.build_type }}
          if-no-files-found: error
          retention-days: 30
