name: Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ~/.cache/ccache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libjack-jackd2-dev \
            ccache \
            libgtk-3-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            pkg-config

          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build-test/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt', 'tests/CMakeLists.txt', 'src/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure
        run: >
          cmake -S . -B build-test
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests
        run: >
          cmake --build build-test
          --config Debug
          --target band-spectrum-analyzer-tests

      - name: Run tests
        run: ./build-test/tests/band-spectrum-analyzer-tests
